name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the build host's glibc is the minimum users need.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, run_tests: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run_tests: true }
          # Cross-compiled on the ARM runner; the binary can't run there without Rosetta.
          - { target: x86_64-apple-darwin, os: macos-latest, run_tests: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run_tests: true }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/odd-even${ext}" "dist/odd-even-${{ matrix.target }}${ext}"

      - uses: actions/upload-artifact@v7
        with:
          name: odd-even-${{ matrix.target }}
          path: dist/*

  # Installs the latest published release, so this checks install.sh, not this commit's build.
  install-script:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: sh install.sh
        env:
          ODD_EVEN_INSTALL_DIR: ${{ runner.temp }}/bin

      - name: Smoke test
        run: test "$("$RUNNER_TEMP/bin/odd-even" 5)" = "5 is odd"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
