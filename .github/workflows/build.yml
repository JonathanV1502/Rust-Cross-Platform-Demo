name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the build host's glibc is the minimum users need.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, run_tests: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run_tests: true }
          # Cross-compiled on the ARM runner; the binary can't run there without Rosetta.
          - { target: x86_64-apple-darwin, os: macos-latest, run_tests: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run_tests: true }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/odd-even${ext}" "dist/odd-even-${{ matrix.target }}${ext}"

      - uses: actions/upload-artifact@v7
        with:
          name: odd-even-${{ matrix.target }}
          path: dist/*

  # Serves this run's binaries over HTTP so the install scripts are tested end to end before release.
  integration:
    name: install (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, shell: sh }
          - { name: macOS ARM, os: macos-latest, shell: sh }
          - { name: macOS Intel, os: macos-15-intel, shell: sh }
          - { name: Windows pwsh, os: windows-latest, shell: pwsh }
          - { name: Windows PowerShell 5.1, os: windows-latest, shell: powershell }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      ODD_EVEN_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Test install.sh
        if: matrix.shell == 'sh'
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          sleep 2
          sh tests/install_test.sh "$RUNNER_TEMP/bin"

      - name: Test install.ps1
        if: matrix.shell != 'sh'
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', 'dist' -WindowStyle Hidden
          Start-Sleep 3
          .\tests\install_test.ps1 "$env:RUNNER_TEMP\bin"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
